---
version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4

linters:
  default: all
  disable:
    # Build metadata and configuration defaults are package-level values.
    - gochecknoglobals
    - varnamelen
    - funlen
    - depguard
    - wsl
    - noinlineerr
    - exhaustruct
    - cyclop
    - testpackage
    - wrapcheck
    - gomodguard
    - gomodguard_v2
    - err113
    - exhaustruct_v5
    # - nonamedreturns
  settings:
    lll:
      line-length: 140
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult
      disabled-tags:
        - performance
    paralleltest:
      ignore-missing: true
      ignore-missing-subtests: true
    misspell:
      locale: US
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    warn-unused: false
    rules:
      # CLI output is intentionally written to stdout by this file.
      - linters:
          - forbidigo
        path: ^output\.go$
      - linters:
          - revive
        text: "package-comments: should have a package comment"
      - linters:
          - gocognit
        text: "cognitive complexity"
      - linters:
          - dupl
          - errcheck
          - goconst
          - golines
          - gosec
          - lll
          - maintidx
        path: _test\.go
    paths:
      - vendor
      - examples$
formatters:
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        # - prefix(github.com/org/project) # Custom section: groups all imports with the specified Prefix.
        # - blank # Blank section: contains all blank imports. This section is not present unless explicitly enabled.
        # - dot # Dot section: contains all dot imports. This section is not present unless explicitly enabled.
        # - alias # Alias section: contains all alias imports. This section is not present unless explicitly enabled.
        - localmodule # Local module section: contains all local packages. This section is not present unless explicitly enabled.
    golines:
      max-len: 140
      shorten-comments: true
  enable:
    - gci
    # - gofmt
    - gofumpt
    # - goimports
    - golines
    # - swaggo
  exclusions:
    generated: lax
    paths:
      - vendor
      - examples$
