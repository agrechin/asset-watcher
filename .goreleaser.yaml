---
version: 2

project_name: asset-watcher
dist: .build/dist

force_token: github

before:
  hooks:
    - task check

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Version }}
      - -X main.Commit={{ .Commit }}
      - -X main.BuildTime={{ .Date }}
    ignore:
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{- .ProjectName }}_ {{- .Version }}_ {{- .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }} {{- if .Arm }}v{{ .Arm }}{{ end -}}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    builds_info:
      group: root
      owner: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE*
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README*
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

brews:
  - name: asset-watcher
    ids:
      - default
    url_template: "https://github.com/agrechin/asset-watcher/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    commit_author:
      name: Andrey Grechin
      email: 36399892+agrechin@users.noreply.github.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula

    homepage: "https://github.com/agrechin/asset-watcher"
    description: &description A command-line utility to fetch a list of IP addresses across a Google Cloud organization through Google Asset API.
    license: &license MIT
    skip_upload: '{{ if eq (index .Env "SKIP_HOMEBREW_UPLOAD") "true" }}true{{ else }}false{{ end }}'

    test: |
      ENV.delete("ASSET_WATCHER_ORG_ID")
      assert_match "ASSET_WATCHER_ORG_ID", shell_output("#{bin}/asset-watcher 2>&1", 1)

    repository:
      owner: agrechin
      name: homebrew-tap
      branch: update-formula-{{ .Tag }}
      pull_request:
        enabled: true
        draft: true
        base:
          owner: agrechin
          name: homebrew-tap
          branch: main

kos:
  - repositories:
      - ghcr.io/agrechin/asset-watcher
    # Local snapshots produce archives without requiring a Docker daemon.
    disable: '{{ .IsSnapshot }}'
    base_image: alpine:3.21.0
    labels:
      org.opencontainers.image.source: https://github.com/agrechin/asset-watcher
      org.opencontainers.image.url: https://github.com/agrechin/asset-watcher
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .CommitTimestamp }}"
      org.opencontainers.image.licenses: *license
      org.opencontainers.image.description: *description
    annotations:
      org.opencontainers.image.source: https://github.com/agrechin/asset-watcher
      org.opencontainers.image.url: https://github.com/agrechin/asset-watcher
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .CommitTimestamp }}"
      org.opencontainers.image.licenses: *license
      org.opencontainers.image.description: *description
    user: "10001:10001"
    tags:
      - latest
      - "{{ .Version }}"
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    sbom: spdx
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Version }}
      - -X main.BuildTime={{ .Date }}
      - -X main.Commit={{ .Commit }}
    bare: true
    preserve_import_paths: false
    platforms:
      - linux/amd64
      - linux/arm64

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

checksum:
  name_template: "{{ .ProjectName }}_checksums_SHA256.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  groups:
    - title: New features
      regexp: '^feat(\(.+\))??!?:.+$'
      order: 100
    - title: Security updates
      regexp: '^sec(\(.+\))??!?:.+$'
      order: 150
    - title: Bug fixes
      regexp: '^(fix|refactor)(\(.+\))??!?:.+$'
      order: 200
    - title: Dependency updates
      regexp: '^deps(\(.+\))??!?:.+$'
      order: 300
    - title: Documentation updates
      regexp: '^docs?(\(.+\))??!?:.+$'
      order: 400
    - title: Build process updates
      regexp: '^(build|ci)(\(.+\))??!?:.+$'
      order: 400
    - title: Other work
      order: 9999
  filters:
    exclude:
      - "^.$"
      - '^test(\(.+\))??!?:.+$'

release:
  draft: true
  make_latest: false
  replace_existing_draft: true
  name_template: "asset-watcher v{{ .Version }}"
  footer: |
    **Full Changelog**: https://github.com/agrechin/asset-watcher/compare/{{ .PreviousTag }}...{{ .Tag }}
